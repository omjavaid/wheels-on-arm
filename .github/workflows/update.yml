name: Update dashboard

on:
  schedule:
    - cron: "0 5 * * 1"     # weekly, Monday 05:00 UTC
  workflow_dispatch:
    inputs:
      top:
        description: "Override top_n for this run (blank = use config.json)"
        required: false
  push:
    branches: [main]
    paths: [config.json, covered.json, scan.py]

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan
        run: |
          if [ -n "${{ github.event.inputs.top }}" ]; then
            python scan.py --top "${{ github.event.inputs.top }}"
          else
            python scan.py
          fi

      - name: Commit results
        run: |
          git config user.name "woa-dashboard-bot"
          git config user.email "actions@github.com"
          git add docs/data.json
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "data: refresh scan $(date -u +%F)"
          git push
